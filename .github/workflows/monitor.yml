name: webseek-monitor
on:
  schedule:
    - cron: '*/15 * * * *'          # 每 15 分钟运行一次
  workflow_dispatch:                # 允许在 Actions 页面手动点击运行

permissions:
  contents: write
  issues: write

concurrency:
  group: webseek-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run webseek
        run: python monitor.py --once --report-file .report.md

      - name: Create notification issue
        if: hashFiles('.report.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(grep -c '^## ' .report.md)
          TITLE=$(head -1 .report.md | sed 's/^## //')
          if [ "$COUNT" -gt 1 ]; then TITLE="$TITLE 等 ${COUNT} 处变化"; fi
          gh issue create --title "网页变化: $TITLE" --body-file .report.md

      - name: Send Webhook on Change (页面变化推送到自己的服务器)
        if: hashFiles('.report.md') != ''
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          REPORT_CONTENT=$(cat .report.md)
          # 使用 jq 按照你的接口要求组装 JSON 结构
          jq -n \
            --arg title "Webseek 网页变化通知" \
            --arg content "$REPORT_CONTENT" \
            --arg type "markdown" \
            '{"title": $title, "content": $content, "type": $type}' \
            | curl -X POST -H "Content-Type: application/json" -d @- $WEBHOOK_URL

      - name: Notify on failure (运行失败推送到自己的服务器)
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          jq -n \
            --arg title "Webseek 监控执行失败" \
            --arg content "本轮监控执行失败，请去 GitHub 仓库查看 Actions 运行日志排查问题。" \
            --arg type "text" \
            '{"title": $title, "content": $content, "type": $type}' \
            | curl -X POST -H "Content-Type: application/json" -d @- $WEBHOOK_URL

      - name: Commit state
        if: always()
        continue-on-error: true
        run: |
          git config user.name "webseek-bot"
          git config user.email "webseek-bot@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          for f in state.json changes.log snapshots; do
            [ -e "$f" ] && git add -f "$f"
          done
          git diff --cached --quiet || {
            git commit -m "chore: 更新监控状态 [skip ci] $(date -u +%F_%T)"
            git push
          }

      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "监控运行失败 $(date -u +%F)" \
            --body "本轮监控执行失败, 请查看 Actions 日志: https://github.com/XJungit/webseek/actions"
