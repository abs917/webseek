# webseek 配置
interval_seconds: 600          
user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) webseek/1.0"
timeout_seconds: 30
retries: 3
ignore_blocks: true            
state_file: "state.json"       
snapshot_dir: "snapshots"      
changelog_file: "changes.log"  

targets:
  - url: "https://www.kdocs.cn/wo/sl/v43PPx0I?no_roaming=true&R=L1MvNzM=&appPageId=J8"
    title: "金山文档更新监控"
